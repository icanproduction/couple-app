<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FFF8F0">
  <title>Nanti Kita — Offline</title>
  <style>
    :root { color-scheme: light; }
    * { box-sizing: border-box; }
    body {
      margin: 0; min-height: 100vh; display: flex; align-items: center; justify-content: center;
      background: #FFF8F0; color: #2D2424; padding: 24px;
      font-family: 'DM Sans', system-ui, -apple-system, 'Segoe UI', sans-serif; text-align: center;
    }
    .card { max-width: 340px; }
    .icon {
      width: 64px; height: 64px; margin: 0 auto 20px; border-radius: 20px; background: rgba(240, 107, 107, 0.1);
      display: flex; align-items: center; justify-content: center;
    }
    h1 { font-size: 22px; margin: 0 0 8px; }
    p { font-size: 14px; line-height: 1.6; color: #8B7E7E; margin: 0 0 24px; }
    button {
      width: 100%; border: 0; border-radius: 16px; background: #F06B6B; color: #fff;
      font: inherit; font-weight: 700; font-size: 14px; padding: 14px 24px; cursor: pointer;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="icon" aria-hidden="true">
      <svg width="30" height="30" viewBox="0 0 24 24" fill="none" stroke="#F06B6B" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <path d="M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z"/>
      </svg>
    </div>
    <h1>Kamu sedang offline</h1>
    <p>Nanti Kita butuh internet untuk menampilkan data kalian. Cek koneksi, lalu coba lagi ya.</p>
    <button type="button" onclick="location.reload()">Coba Lagi</button>
  </div>
</body>
</html>
